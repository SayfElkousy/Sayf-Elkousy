<!doctype html>
<html><head><meta charset="utf-8"><title>Device frame</title>
<style>html,body{margin:0;background:#111}iframe{border:0;display:block}</style></head>
<body>
<!-- Renders the site at an exact device size: /tests/frame.html?src=/play&w=390&h=844&y=0 -->
<script>
  const q = new URLSearchParams(location.search);
  const f = document.createElement('iframe');
  f.width = q.get('w') || 390; f.height = q.get('h') || 844;
  f.src = q.get('src') || '/';
  if (q.get('y')) f.onload = () => setTimeout(() => f.contentWindow.scrollTo(0, +q.get('y')), +(q.get('delay') || 1200));
  // ?nav=/about&freeze=300 → click a nav link after load, freeze all animations N ms later.
  if (q.get('nav')) f.onload = () => setTimeout(() => {
    const d = f.contentDocument;
    d.querySelector(`a[href="${q.get('nav')}"]`).click();
    setTimeout(() => {
      d.getAnimations().forEach((a) => a.pause());
      f.contentWindow.__frozen = true;
    }, +q.get('freeze'));
  }, 1500);
  document.body.appendChild(f);
</script>
</body></html>
